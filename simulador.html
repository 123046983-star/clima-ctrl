<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de minisplit</title>
  <style>
    body { background: #0b1220; color: #e8eefb; font: 14px -apple-system, 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
    .wrap { max-width: 560px; margin: auto; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: #8a9bbd; }
    .card { background: #121b2d; border: 1px solid #233150; border-radius: 14px; padding: 14px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid div { background: #1a2640; border-radius: 10px; padding: 10px; }
    .grid b { display: block; font-size: 1.3rem; margin-top: 4px; }
    small { color: #8a9bbd; }
    button { background: #38bdf8; color: #fff; border: 0; border-radius: 10px; padding: 12px; font-weight: 600; cursor: pointer; width: 100%; }
    label { display: flex; gap: 8px; align-items: center; }
    input[type=range] { flex: 1; }
    pre { background: #070c16; border-radius: 10px; padding: 10px; height: 190px; overflow: auto; font-size: 12px; color: #9fb3d8; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Simulador del equipo (hace de ESP32)</h1>
    <div class="card">
      <small id="topics"></small>
    </div>
    <div class="card grid">
      <div><small>Encendido</small><b id="sPower">-</b></div>
      <div><small>Modo</small><b id="sMode">-</b></div>
      <div><small>Objetivo</small><b id="sSet">-</b></div>
      <div><small>Temp. cuarto</small><b id="sTemp">-</b></div>
      <div><small>Humedad</small><b id="sHum">-</b></div>
      <div><small>Ventilador</small><b id="sFan">-</b></div>
    </div>
    <div class="card">
      <label>Temp. exterior <input type="range" id="outside" min="15" max="40" value="32"> <span id="outsideV">32 °C</span></label>
      <label><input type="checkbox" id="ignore"> Ignorar comandos (para probar el aviso de "no se pudo")</label>
    </div>
    <button id="btn">Conectar simulador</button>
    <pre id="log"></pre>
  </div>

  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <script>
    const cfg = Object.assign(
      { broker: 'broker.hivemq.com', port: 8884, path: '/mqtt', device: 'AC-CTRL-7F3A2C' },
      JSON.parse(localStorage.getItem('clima-config') || '{}'))
    const T = {
      telemetry: `clima/ctrl/${cfg.device}/telemetry`,
      command:   `clima/ctrl/${cfg.device}/command`
    }
    document.getElementById('topics').innerHTML =
      `Escucha: <code>${T.command}</code><br>Publica cada 2 s: <code>${T.telemetry}</code>`

    const st = { power: false, mode: 'cool', setpoint: 24, fan: 'auto', swing: false, temp: 28.0, hum: 60, running: false }
    let client = null, timer = null

    const log = m => {
      const el = document.getElementById('log')
      el.textContent = `${new Date().toLocaleTimeString()}  ${m}\n` + el.textContent
    }

    function step() {
      const outside = Number(document.getElementById('outside').value)
      const fanK = { auto: 1, 1: 0.6, 2: 1, 3: 1.4 }[st.fan]
      let target = outside                          // sin equipo, el cuarto tiende al exterior
      let mode = st.mode
      if (mode === 'auto') mode = st.temp > st.setpoint ? 'cool' : 'heat'
      st.running = false
      if (st.power && (mode === 'cool' || mode === 'dry') && st.temp > st.setpoint - 0.3) { target = 14; st.running = true }
      if (st.power && mode === 'heat' && st.temp < st.setpoint + 0.3) { target = 38; st.running = true }
      if (st.power && st.mode === 'fan') st.running = true
      const k = st.running && st.mode !== 'fan' ? 0.03 * fanK : 0.004
      st.temp += (target - st.temp) * k + (Math.random() - 0.5) * 0.05
      const humTarget = st.power && (st.mode === 'dry' || mode === 'cool') && st.running ? 40 : 62
      st.hum += (humTarget - st.hum) * 0.02
      publish()
    }

    function publish() {
      const msg = { ...st, temp: +st.temp.toFixed(1), hum: Math.round(st.hum) }
      client.publish(T.telemetry, JSON.stringify(msg))
      sPower.textContent = st.power ? 'Sí' : 'No'
      sMode.textContent = st.mode
      sSet.textContent = st.setpoint + ' °C'
      sTemp.textContent = msg.temp + ' °C'
      sHum.textContent = msg.hum + ' %'
      sFan.textContent = st.fan
    }

    function onCommand(payload) {
      let cmd
      try { cmd = JSON.parse(payload) } catch (_) { return log('comando mal formado: ' + payload) }
      log('comando: ' + payload)
      if (document.getElementById('ignore').checked) return log('  (ignorado)')
      if (typeof cmd.power === 'boolean') st.power = cmd.power
      if (['auto', 'cool', 'heat', 'dry', 'fan'].includes(cmd.mode)) st.mode = cmd.mode
      if (Number.isFinite(cmd.setpoint)) st.setpoint = Math.min(30, Math.max(16, Math.round(cmd.setpoint)))
      if (cmd.fan === 'auto' || [1, 2, 3].includes(cmd.fan)) st.fan = cmd.fan
      if (typeof cmd.swing === 'boolean') st.swing = cmd.swing
      setTimeout(publish, 300)     // confirma rápido, como lo haría el ESP32
    }

    document.getElementById('outside').oninput = e =>
      document.getElementById('outsideV').textContent = e.target.value + ' °C'

    document.getElementById('btn').onclick = () => {
      if (client) {
        client.end(true); client = null; clearInterval(timer)
        btn.textContent = 'Conectar simulador'; return log('desconectado')
      }
      client = mqtt.connect(`wss://${cfg.broker}:${cfg.port}${cfg.path}`,
        { clientId: 'clima-sim-' + Math.random().toString(16).slice(2, 8), reconnectPeriod: 5000 })
      client.on('connect', () => {
        client.subscribe(T.command)
        log('conectado a ' + cfg.broker)
        btn.textContent = 'Desconectar simulador'
        clearInterval(timer)
        timer = setInterval(step, 2000)
        publish()
      })
      client.on('message', (_t, p) => onCommand(p.toString()))
      client.on('error', e => log('error: ' + e.message))
    }
    if (location.hash === '#auto') document.getElementById('btn').click()
  </script>
</body>
</html>
